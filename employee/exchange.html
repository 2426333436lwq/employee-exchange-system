<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分兑换 - 企业员工积分兑换系统</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>员工中心</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="employee.html">个人中心</a></li>
                <li><a href="my-points.html">我的积分</a></li>
                <li><a href="exchange.html" class="active">积分兑换</a></li>
                <li><a href="exchange-history.html">兑换历史</a></li>
            </ul>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部导航栏 -->
            <div class="top-nav">
                <div class="nav-left">
                    <h1>积分兑换</h1>
                </div>
                <div class="nav-right">
                    <div class="user-info" onclick="toggleUserDropdown()">
                        <div class="user-avatar" id="userAvatar"></div>
                        <span id="userName">员工</span>
                    </div>
                    <div class="user-dropdown" id="userDropdown">
                        <ul>
                            <li><a href="personal-info.html">个人信息</a></li>
                            <li><a href="#" onclick="logout()">退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- 积分兑换内容 -->
            <div class="dashboard">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索商品...">
                    <button class="btn btn-primary" onclick="searchProducts()">搜索</button>
                </div>
                
                <!-- 商品分类 -->
                <div style="margin-bottom: 20px;">
                    <button class="btn btn-secondary" onclick="filterProducts('all')">全部</button>
                    <button class="btn btn-secondary" onclick="filterProducts('电子产品')">电子产品</button>
                    <button class="btn btn-secondary" onclick="filterProducts('办公用品')">办公用品</button>
                    <button class="btn btn-secondary" onclick="filterProducts('生活用品')">生活用品</button>
                </div>
                
                <!-- 商品列表 -->
                <div id="productList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px;">
                    <!-- 商品卡片将通过JS动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 兑换确认模态框 -->
    <div class="modal" id="exchangeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">确认兑换</h3>
                <button class="modal-close" onclick="closeModal('exchangeModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div style="text-align: center; margin-bottom: 20px;">
                    <h4 id="modalProductName">商品名称</h4>
                    <p style="color: #666;">积分价格: <span id="modalProductPrice">0</span></p>
                    <p style="color: #666;">当前积分: <span id="modalUserPoints">0</span></p>
                </div>
                <p style="text-align: center; margin: 20px 0;">确定要兑换此商品吗？</p>
            </div>
            <div class="form-actions">
                <button class="btn btn-secondary" onclick="closeModal('exchangeModal')">取消</button>
                <button class="btn btn-primary" onclick="confirmExchange()">确认兑换</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        // 全局变量
        let selectedProduct = null;
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 加载用户信息
            loadUserInfo();
            // 加载商品列表
            loadProductList();
        });
        
        /**
         * 加载用户信息
         */
        function loadUserInfo() {
            const user = getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = user.name;
                document.getElementById('userAvatar').textContent = user.name.charAt(0);
            }
        }
        
        /**
         * 切换用户下拉菜单
         */
        function toggleUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown.classList.toggle('show');
        }
        
        /**
         * 点击页面其他地方关闭下拉菜单
         */
        document.addEventListener('click', function(event) {
            const userInfo = document.querySelector('.user-info');
            const dropdown = document.getElementById('userDropdown');
            if (!userInfo.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });
        
        /**
         * 加载商品列表
         */
        function loadProductList() {
            const productList = document.getElementById('productList');
            if (!productList) return;
            
            productList.innerHTML = '';
            
            const products = getProducts();
            const user = getCurrentUser();
            const userPoints = user ? user.points || 0 : 0;
            
            products.forEach(product => {
                if (product.status === '上架' && product.stock > 0) {
                    const canExchange = userPoints >= product.price;
                    const card = document.createElement('div');
                    card.className = 'dashboard-card';
                    card.style.cursor = 'pointer';
                    card.style.opacity = canExchange ? '1' : '0.7';
                    card.innerHTML = `
                        <div style="font-size: 32px; margin-bottom: 10px;">📦</div>
                        <div class="card-title">${product.name}</div>
                        <div style="font-size: 14px; color: #666; margin: 5px 0;">${product.category}</div>
                        <div class="card-value" style="margin: 10px 0;">${product.price} 积分</div>
                        <div style="font-size: 12px; color: #999;">库存: ${product.stock}</div>
                        <button class="btn btn-primary" style="margin-top: 15px; width: 100%;" onclick="openExchangeModal(${product.id})" ${!canExchange ? 'disabled' : ''}>
                            ${canExchange ? '立即兑换' : '积分不足'}
                        </button>
                    `;
                    productList.appendChild(card);
                }
            });
        }
        
        /**
         * 搜索商品
         */
        function searchProducts() {
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            const productList = document.getElementById('productList');
            if (!productList) return;
            
            productList.innerHTML = '';
            
            const products = getProducts();
            const user = getCurrentUser();
            const userPoints = user ? user.points || 0 : 0;
            
            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(searchInput) ||
                product.category.toLowerCase().includes(searchInput)
            );
            
            filteredProducts.forEach(product => {
                if (product.status === '上架' && product.stock > 0) {
                    const canExchange = userPoints >= product.price;
                    const card = document.createElement('div');
                    card.className = 'dashboard-card';
                    card.style.cursor = 'pointer';
                    card.style.opacity = canExchange ? '1' : '0.7';
                    card.innerHTML = `
                        <div style="font-size: 32px; margin-bottom: 10px;">📦</div>
                        <div class="card-title">${product.name}</div>
                        <div style="font-size: 14px; color: #666; margin: 5px 0;">${product.category}</div>
                        <div class="card-value" style="margin: 10px 0;">${product.price} 积分</div>
                        <div style="font-size: 12px; color: #999;">库存: ${product.stock}</div>
                        <button class="btn btn-primary" style="margin-top: 15px; width: 100%;" onclick="openExchangeModal(${product.id})" ${!canExchange ? 'disabled' : ''}>
                            ${canExchange ? '立即兑换' : '积分不足'}
                        </button>
                    `;
                    productList.appendChild(card);
                }
            });
        }
        
        /**
         * 筛选商品
         * @param {string} category 商品分类
         */
        function filterProducts(category) {
            const productList = document.getElementById('productList');
            if (!productList) return;
            
            productList.innerHTML = '';
            
            const products = getProducts();
            const user = getCurrentUser();
            const userPoints = user ? user.points || 0 : 0;
            
            const filteredProducts = category === 'all' ? 
                products : 
                products.filter(product => product.category === category);
            
            filteredProducts.forEach(product => {
                if (product.status === '上架' && product.stock > 0) {
                    const canExchange = userPoints >= product.price;
                    const card = document.createElement('div');
                    card.className = 'dashboard-card';
                    card.style.cursor = 'pointer';
                    card.style.opacity = canExchange ? '1' : '0.7';
                    card.innerHTML = `
                        <div style="font-size: 32px; margin-bottom: 10px;">📦</div>
                        <div class="card-title">${product.name}</div>
                        <div style="font-size: 14px; color: #666; margin: 5px 0;">${product.category}</div>
                        <div class="card-value" style="margin: 10px 0;">${product.price} 积分</div>
                        <div style="font-size: 12px; color: #999;">库存: ${product.stock}</div>
                        <button class="btn btn-primary" style="margin-top: 15px; width: 100%;" onclick="openExchangeModal(${product.id})" ${!canExchange ? 'disabled' : ''}>
                            ${canExchange ? '立即兑换' : '积分不足'}
                        </button>
                    `;
                    productList.appendChild(card);
                }
            });
        }
        
        /**
         * 打开兑换确认模态框
         * @param {number} productId 商品ID
         */
        function openExchangeModal(productId) {
            const products = getProducts();
            const product = products.find(p => p.id === productId);
            const user = getCurrentUser();
            
            if (product && user) {
                selectedProduct = product;
                document.getElementById('modalProductName').textContent = product.name;
                document.getElementById('modalProductPrice').textContent = product.price;
                document.getElementById('modalUserPoints').textContent = user.points || 0;
                
                const modal = document.getElementById('exchangeModal');
                modal.classList.add('show');
            }
        }
        
        /**
         * 关闭模态框
         * @param {string} modalId 模态框ID
         */
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('show');
            selectedProduct = null;
        }
        
        /**
         * 确认兑换
         */
        function confirmExchange() {
            if (!selectedProduct) return;

            // 二次校验库存（页面渲染后可能被其他人兑换完）
            const products = getProducts();
            const currentProduct = products.find(p => p.id === selectedProduct.id);
            if (!currentProduct || currentProduct.stock <= 0 || currentProduct.status !== '上架') {
                alert('该商品库存不足或已下架');
                closeModal('exchangeModal');
                return;
            }

            const user = getCurrentUser();
            if (!user || (user.points || 0) < selectedProduct.price) {
                alert('积分不足，无法兑换');
                return;
            }

            // addExchangeRecord 已处理积分扣减、库存更新和持久化
            addExchangeRecord(user, selectedProduct);

            alert('兑换成功！');
            closeModal('exchangeModal');
            loadProductList();
        }
    </script>
</body>
</html>
