<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兑换历史 - 企业员工积分兑换系统</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>员工中心</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="employee.html">个人中心</a></li>
                <li><a href="my-points.html">我的积分</a></li>
                <li><a href="exchange.html">积分兑换</a></li>
                <li><a href="exchange-history.html" class="active">兑换历史</a></li>
            </ul>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部导航栏 -->
            <div class="top-nav">
                <div class="nav-left">
                    <h1>兑换历史</h1>
                </div>
                <div class="nav-right">
                    <div class="user-info" onclick="toggleUserDropdown()">
                        <div class="user-avatar" id="userAvatar"></div>
                        <span id="userName">员工</span>
                    </div>
                    <div class="user-dropdown" id="userDropdown">
                        <ul>
                            <li><a href="personal-info.html">个人信息</a></li>
                            <li><a href="#" onclick="logout()">退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- 兑换历史内容 -->
            <div class="dashboard">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索兑换记录...">
                    <button class="btn btn-primary" onclick="searchExchangeHistory()">搜索</button>
                </div>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>订单号</th>
                                <th>商品</th>
                                <th>积分</th>
                                <th>兑换时间</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="exchangeHistoryList">
                            <!-- 兑换历史记录将通过JS动态生成 -->
                        </tbody>
                    </table>
                </div>
                
                <div class="pagination">
                    <button onclick="prevPage()">上一页</button>
                    <button class="active">1</button>
                    <button onclick="nextPage()">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 加载用户信息
            loadUserInfo();
            // 加载兑换历史
            loadExchangeHistory();
        });
        
        /**
         * 加载用户信息
         */
        function loadUserInfo() {
            const user = getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = user.name;
                document.getElementById('userAvatar').textContent = user.name.charAt(0);
            }
        }
        
        /**
         * 切换用户下拉菜单
         */
        function toggleUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown.classList.toggle('show');
        }
        
        /**
         * 点击页面其他地方关闭下拉菜单
         */
        document.addEventListener('click', function(event) {
            const userInfo = document.querySelector('.user-info');
            const dropdown = document.getElementById('userDropdown');
            if (!userInfo.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });
        
        /**
         * 加载兑换历史
         */
        function loadExchangeHistory() {
            const exchangeHistoryList = document.getElementById('exchangeHistoryList');
            if (!exchangeHistoryList) return;
            
            exchangeHistoryList.innerHTML = '';
            
            const user = getCurrentUser();
            if (!user) return;
            
            // 从全局兑换记录数据获取
            const exchangeRecords = getExchangeRecords();
            
            // 筛选当前用户的兑换记录
            const userRecords = exchangeRecords.filter(record => record.userName === user.name);
            
            if (userRecords.length > 0) {
                userRecords.forEach(record => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>ORD-${record.id.toString().padStart(6, '0')}</td>
                        <td>${record.productName}</td>
                        <td>${record.points}</td>
                        <td>${record.exchangeTime}</td>
                        <td><span class="status-tag ${record.status === '已完成' ? 'status-completed' : 'status-pending'}">${record.status}</span></td>
                        <td>
                            <button class="btn btn-primary" onclick="viewOrderDetails(${record.id})">查看详情</button>
                        </td>
                    `;
                    exchangeHistoryList.appendChild(row);
                });
            } else {
                const row = document.createElement('tr');
                row.innerHTML = `<td colspan="6" style="text-align: center; color: #999;">暂无兑换记录</td>`;
                exchangeHistoryList.appendChild(row);
            }
        }
        
        /**
         * 搜索兑换历史
         */
        function searchExchangeHistory() {
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            const exchangeHistoryList = document.getElementById('exchangeHistoryList');
            if (!exchangeHistoryList) return;
            
            exchangeHistoryList.innerHTML = '';
            
            const user = getCurrentUser();
            if (!user) return;
            
            // 从全局兑换记录数据获取
            const exchangeRecords = getExchangeRecords();
            
            // 筛选当前用户的兑换记录
            const userRecords = exchangeRecords.filter(record => 
                record.userName === user.name &&
                (record.productName.toLowerCase().includes(searchInput) ||
                 record.exchangeTime.includes(searchInput))
            );
            
            if (userRecords.length > 0) {
                userRecords.forEach(record => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>ORD-${record.id.toString().padStart(6, '0')}</td>
                        <td>${record.productName}</td>
                        <td>${record.points}</td>
                        <td>${record.exchangeTime}</td>
                        <td><span class="status-tag ${record.status === '已完成' ? 'status-completed' : 'status-pending'}">${record.status}</span></td>
                        <td>
                            <button class="btn btn-primary" onclick="viewOrderDetails(${record.id})">查看详情</button>
                        </td>
                    `;
                    exchangeHistoryList.appendChild(row);
                });
            } else {
                const row = document.createElement('tr');
                row.innerHTML = `<td colspan="6" style="text-align: center; color: #999;">未找到匹配的兑换记录</td>`;
                exchangeHistoryList.appendChild(row);
            }
        }
        
        /**
         * 查看订单详情
         * @param {number} orderId 订单ID
         */
        function viewOrderDetails(orderId) {
            const records = getExchangeRecords();
            const record = records.find(r => r.id === orderId);
            if (record) {
                const msg = `订单详情\n━━━━━━━━━━━━━━━\n订单号：ORD-${String(record.id).padStart(6, '0')}\n商品：${record.productName}\n积分：${record.points}\n兑换时间：${record.exchangeTime}\n状态：${record.status}`;
                alert(msg);
            } else {
                alert('未找到订单信息');
            }
        }
        
        /**
         * 上一页
         */
        function prevPage() {
            alert('上一页功能开发中...');
        }
        
        /**
         * 下一页
         */
        function nextPage() {
            alert('下一页功能开发中...');
        }
    </script>
</body>
</html>
