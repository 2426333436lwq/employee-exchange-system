<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - 积分兑换系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4A7CFF',
                        'primary-light': '#6B8FFF',
                        accent: '#FF6B6B',
                        'text-dark': '#1a1a1a',
                        'text-medium': '#5a5a5a',
                        'text-light': '#999999',
                        'bg-light': '#f0f4fa',
                        'bg-lighter': '#f5f7fa'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .login-bg {
            background: linear-gradient(135deg, #4A7CFF 0%, #6B8FFF 100%);
            min-height: 100vh;
        }
        .input-field {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 14px 16px;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s;
        }
        .input-field:focus {
            outline: none;
            border-color: white;
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .btn-login {
            background: white;
            color: #4A7CFF;
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
        .remember-me input {
            width: 18px;
            height: 18px;
            accent-color: white;
        }
    </style>
</head>
<body class="login-bg">
    <div class="min-h-screen flex flex-col items-center justify-center px-6">
        <!-- Logo区域 -->
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="ri-gift-line text-4xl text-primary"></i>
            </div>
            <h1 class="text-white text-2xl font-bold mb-2">积分兑换系统</h1>
            <p class="text-white/70 text-sm">企业员工专属福利平台</p>
        </div>

        <!-- 登录表单 -->
        <div class="w-full max-w-sm">
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="space-y-4 mb-6">
                    <div>
                        <input type="text" id="username" class="input-field" placeholder="请输入账号" required>
                    </div>
                    <div>
                        <input type="password" id="password" class="input-field" placeholder="请输入密码" required>
                    </div>
                </div>

                <div class="flex items-center justify-between mb-6">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me">
                        <span>记住账号</span>
                    </label>
                    <a href="#" class="text-white/80 text-sm hover:text-white">忘记密码？</a>
                </div>

                <button type="submit" class="btn-login">
                    登 录
                </button>
            </form>

            <!-- 其他登录方式 -->
            <div class="mt-10">
                <div class="flex items-center gap-4 mb-6">
                    <div class="flex-1 h-px bg-white/20"></div>
                    <span class="text-white/60 text-sm">其他登录方式</span>
                    <div class="flex-1 h-px bg-white/20"></div>
                </div>
                <div class="flex justify-center gap-10">
                    <div class="w-12 h-12 bg-green-500 rounded-full flex items-center justify-center cursor-pointer hover:bg-green-600 transition">
                        <i class="ri-wechat-fill text-2xl text-white"></i>
                    </div>
                    <div class="w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center cursor-pointer hover:bg-blue-600 transition">
                        <i class="ri-building-2-fill text-2xl text-white"></i>
                    </div>
                    <div class="w-12 h-12 bg-blue-400 rounded-full flex items-center justify-center cursor-pointer hover:bg-blue-500 transition">
                        <i class="ri-alipay-fill text-2xl text-white"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部版权 -->
        <div class="mt-auto pt-10 text-center">
            <p class="text-white/50 text-xs">© 2026 企业内部福利系统. All rights reserved.</p>
        </div>
    </div>

    <!-- 错误提示 -->
    <div id="error-toast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/80 text-white px-6 py-3 rounded-lg text-sm opacity-0 transition-opacity duration-300 pointer-events-none">
        账号或密码错误
    </div>

    <script>
        // 页面加载时检查是否记住账号
        document.addEventListener('DOMContentLoaded', function() {
            const rememberedUsername = localStorage.getItem('rememberedUsername');
            if (rememberedUsername) {
                document.getElementById('username').value = rememberedUsername;
                document.getElementById('remember-me').checked = true;
            }
        });

        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('remember-me').checked;
            
            // 默认账号密码验证
            if (username === 'admin' && password === '123456') {
                // 记住账号
                if (rememberMe) {
                    localStorage.setItem('rememberedUsername', username);
                } else {
                    localStorage.removeItem('rememberedUsername');
                }
                
                // 登录成功，跳转到首页
                window.location.href = 'index.html';
            } else {
                // 显示错误提示
                const toast = document.getElementById('error-toast');
                toast.style.opacity = '1';
                setTimeout(() => {
                    toast.style.opacity = '0';
                }, 2000);
            }
        }
    </script>
</body>
</html>
