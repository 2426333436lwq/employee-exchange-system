<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台 - 企业员工积分兑换系统</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>管理员后台</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="admin.html" class="active">仪表盘</a></li>
                <li><a href="user-management.html">用户管理</a></li>
                <li><a href="product-management.html">商品管理</a></li>
                <li><a href="exchange-management.html">兑换管理</a></li>
                <li><a href="points-management.html">积分管理</a></li>
            </ul>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部导航栏 -->
            <div class="top-nav">
                <div class="nav-left">
                    <h1>仪表盘</h1>
                </div>
                <div class="nav-right">
                    <div class="user-info" onclick="toggleUserDropdown()">
                        <div class="user-avatar" id="userAvatar"></div>
                        <span id="userName">管理员</span>
                    </div>
                    <div class="user-dropdown" id="userDropdown">
                        <ul>
                            <li><a href="personal-info.html">个人信息</a></li>
                            <li><a href="#" onclick="logout()">退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- 仪表盘内容 -->
            <div class="dashboard">
                <h2 class="section-title">系统概览</h2>
                
                <!-- 统计卡片 -->
                <div class="dashboard-cards">
                    <div class="dashboard-card" onclick="window.location.href='statistics/user-statistics.html'">
                        <div class="card-icon">👥</div>
                        <div class="card-title">总用户数</div>
                        <div class="card-value" id="statTotalUsers">--</div>
                    </div>
                    <div class="dashboard-card" onclick="window.location.href='statistics/product-statistics.html'">
                        <div class="card-icon">📦</div>
                        <div class="card-title">商品总数</div>
                        <div class="card-value" id="statTotalProducts">--</div>
                    </div>
                    <div class="dashboard-card" onclick="window.location.href='statistics/today-exchanges.html'">
                        <div class="card-icon">📈</div>
                        <div class="card-title">今日兑换</div>
                        <div class="card-value" id="statTodayExchanges">--</div>
                    </div>
                    <div class="dashboard-card" onclick="window.location.href='statistics/pending-orders.html'">
                        <div class="card-icon">⏳</div>
                        <div class="card-title">待处理订单</div>
                        <div class="card-value" id="statPendingOrders">--</div>
                    </div>
                </div>
                
                <!-- 最近兑换记录 -->
                <h2 class="section-title">最近兑换记录</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>订单号</th>
                                <th>用户</th>
                                <th>商品</th>
                                <th>积分</th>
                                <th>兑换时间</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="recentExchanges">
                            <!-- 最近兑换记录将通过JS动态生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 加载用户信息
            loadUserInfo();
            // 加载仪表盘统计数据
            loadDashboardStats();
            // 加载最近兑换记录
            loadRecentExchanges();
        });
        
        /**
         * 加载仪表盘统计数据 — 基于实际数据动态计算
         */
        function loadDashboardStats() {
            const users = getUsers();
            const products = getProducts();
            const records = getExchangeRecords();

            const totalEmployees = users.filter(u => u.role === 'employee').length;
            const totalProducts = products.length;
            const todayStr = formatDate(new Date()).substring(0, 10);
            const todayExchanges = records.filter(r => r.exchangeTime && r.exchangeTime.startsWith(todayStr)).length;
            const pendingOrders = records.filter(r => r.status === '待处理').length;

            document.getElementById('statTotalUsers').textContent = totalEmployees;
            document.getElementById('statTotalProducts').textContent = totalProducts;
            document.getElementById('statTodayExchanges').textContent = todayExchanges;
            document.getElementById('statPendingOrders').textContent = pendingOrders;
        }
        
        /**
         * 加载用户信息
         */
        function loadUserInfo() {
            const user = getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = user.name;
                document.getElementById('userAvatar').textContent = user.name.charAt(0);
            }
        }
        
        /**
         * 切换用户下拉菜单
         */
        function toggleUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown.classList.toggle('show');
        }
        
        /**
         * 点击页面其他地方关闭下拉菜单
         */
        document.addEventListener('click', function(event) {
            const userInfo = document.querySelector('.user-info');
            const dropdown = document.getElementById('userDropdown');
            if (!userInfo.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });
        
        /**
         * 加载最近兑换记录
         */
        function loadRecentExchanges() {
            const recentExchanges = document.getElementById('recentExchanges');
            if (!recentExchanges) return;
            
            const records = getExchangeRecords();
            recentExchanges.innerHTML = '';
            
            // 只显示最近5条记录
            const recentRecords = records.slice(0, 5);
            
            recentRecords.forEach(record => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>ORD-${record.id.toString().padStart(6, '0')}</td>
                    <td>${record.userName}</td>
                    <td>${record.productName}</td>
                    <td>${record.points}</td>
                    <td>${record.exchangeTime}</td>
                    <td><span class="status-tag ${record.status === '已完成' ? 'status-completed' : 'status-pending'}">${record.status}</span></td>
                `;
                recentExchanges.appendChild(row);
            });
        }
    </script>
</body>
</html>
