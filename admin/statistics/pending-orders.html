<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待处理订单 - 企业员工积分兑换系统</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>管理员后台</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="../admin.html">仪表盘</a></li>
                <li><a href="../user-management.html">用户管理</a></li>
                <li><a href="../product-management.html">商品管理</a></li>
                <li><a href="../exchange-management.html">兑换管理</a></li>
                <li><a href="../points-management.html">积分管理</a></li>
            </ul>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部导航栏 -->
            <div class="top-nav">
                <div class="nav-left">
                    <h1>待处理订单统计</h1>
                </div>
                <div class="nav-right">
                    <div class="user-info" onclick="toggleUserDropdown()">
                        <div class="user-avatar" id="userAvatar"></div>
                        <span id="userName">管理员</span>
                    </div>
                    <div class="user-dropdown" id="userDropdown">
                        <ul>
                            <li><a href="../personal-info.html">个人信息</a></li>
                            <li><a href="#" onclick="logout()">退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- 待处理订单详情 -->
            <div id="pendingOrders" class="fade-in">
                <div class="dashboard-cards" style="margin-bottom: 30px;">
                    <div class="dashboard-card">
                        <div class="card-icon">⏳</div>
                        <div class="card-title">待处理订单</div>
                        <div class="card-value">12</div>
                    </div>
                    <div class="dashboard-card">
                        <div class="card-icon">⚠️</div>
                        <div class="card-title">超过24小时</div>
                        <div class="card-value">3</div>
                    </div>
                    <div class="dashboard-card">
                        <div class="card-icon">💎</div>
                        <div class="card-title">待消耗积分</div>
                        <div class="card-value">4,280</div>
                    </div>
                    <div class="dashboard-card">
                        <div class="card-icon">⏰</div>
                        <div class="card-title">平均处理时间</div>
                        <div class="card-value">4.5小时</div>
                    </div>
                </div>
                
                <!-- 搜索框 -->
                <div class="search-box">
                    <input type="text" id="pendingSearchInput" placeholder="搜索订单...">
                    <button class="btn btn-primary" onclick="searchPendingOrders()">搜索</button>
                </div>
                
                <!-- 待处理订单列表 -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>订单号</th>
                                <th>用户</th>
                                <th>商品</th>
                                <th>积分</th>
                                <th>提交时间</th>
                                <th>等待时长</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="pendingOrderList">
                            <!-- 待处理订单数据将通过JS动态生成 -->
                        </tbody>
                    </table>
                </div>
                
                <!-- 分页 -->
                <div class="pagination">
                    <button>上一页</button>
                    <button class="active">1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>下一页</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/app.js"></script>
    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 加载用户信息
            loadUserInfo();
            // 加载待处理订单统计数据
            loadPendingOrderStatistics();
        });
        
        /**
         * 加载用户信息
         */
        function loadUserInfo() {
            const user = getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = user.name;
                document.getElementById('userAvatar').textContent = user.name.charAt(0);
            }
        }
        
        /**
         * 切换用户下拉菜单
         */
        function toggleUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown.classList.toggle('show');
        }
        
        /**
         * 点击页面其他地方关闭下拉菜单
         */
        document.addEventListener('click', function(event) {
            const userInfo = document.querySelector('.user-info');
            const dropdown = document.getElementById('userDropdown');
            if (!userInfo.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });
        
        /**
         * 加载待处理订单统计数据 — 基于实际数据
         */
        function loadPendingOrderStatistics() {
            const pendingOrderList = document.getElementById('pendingOrderList');
            if (!pendingOrderList) return;

            pendingOrderList.innerHTML = '';

            // 从全局待处理订单数据获取
            const pendingOrders = getPendingOrders();

            // 更新统计卡片
            const records = getExchangeRecords();
            const pendingRecords = records.filter(r => r.status === '待处理');
            const totalPending = pendingRecords.length;
            const totalPoints = pendingRecords.reduce((sum, r) => sum + r.points, 0);

            // 更新DOM中的统计卡片（通过选择器查找卡片内的.card-value）
            const cards = document.querySelectorAll('.dashboard-cards .dashboard-card .card-value');
            if (cards.length >= 4) {
                cards[0].textContent = totalPending;
                // 超过24h 和 平均处理时间保留原模拟值（无真实时间戳）
                cards[2].textContent = totalPoints.toLocaleString();
            }

            pendingOrders.forEach(item => {
                const row = document.createElement('tr');
                const waitTimeColor = item.waitTime.includes('24') || item.waitTime.includes('25') ? '#F56C6C' : '#E6A23C';
                row.innerHTML = `
                    <td>${item.orderId}</td>
                    <td>${item.user}</td>
                    <td>${item.product}</td>
                    <td>${item.points}</td>
                    <td>${item.submitTime}</td>
                    <td style="color: ${waitTimeColor}; font-weight: 600;">${item.waitTime}</td>
                    <td><button class="btn btn-primary" style="padding: 4px 8px; font-size: 12px;" onclick="processPendingOrder('${item.orderId}')">处理</button></td>
                `;
                pendingOrderList.appendChild(row);
            });
        }

        /**
         * 搜索待处理订单
         */
        function searchPendingOrders() {
            const searchInput = document.getElementById('pendingSearchInput').value.toLowerCase();
            const pendingOrderList = document.getElementById('pendingOrderList');
            if (!pendingOrderList) return;

            const pendingOrders = getPendingOrders();
            pendingOrderList.innerHTML = '';

            const filtered = pendingOrders.filter(item =>
                item.orderId.toLowerCase().includes(searchInput) ||
                item.user.includes(searchInput) ||
                item.product.includes(searchInput)
            );

            filtered.forEach(item => {
                const row = document.createElement('tr');
                const waitTimeColor = item.waitTime.includes('24') || item.waitTime.includes('25') ? '#F56C6C' : '#E6A23C';
                row.innerHTML = `
                    <td>${item.orderId}</td>
                    <td>${item.user}</td>
                    <td>${item.product}</td>
                    <td>${item.points}</td>
                    <td>${item.submitTime}</td>
                    <td style="color: ${waitTimeColor}; font-weight: 600;">${item.waitTime}</td>
                    <td><button class="btn btn-primary" style="padding: 4px 8px; font-size: 12px;" onclick="processPendingOrder('${item.orderId}')">处理</button></td>
                `;
                pendingOrderList.appendChild(row);
            });
        }
    </script>
</body>
</html>
