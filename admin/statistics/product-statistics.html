<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品统计 - 企业员工积分兑换系统</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>管理员后台</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="../admin.html">仪表盘</a></li>
                <li><a href="../user-management.html">用户管理</a></li>
                <li><a href="../product-management.html">商品管理</a></li>
                <li><a href="../exchange-management.html">兑换管理</a></li>
                <li><a href="../points-management.html">积分管理</a></li>
            </ul>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部导航栏 -->
            <div class="top-nav">
                <div class="nav-left">
                    <h1>商品统计详情</h1>
                </div>
                <div class="nav-right">
                    <div class="user-info" onclick="toggleUserDropdown()">
                        <div class="user-avatar" id="userAvatar"></div>
                        <span id="userName">管理员</span>
                    </div>
                    <div class="user-dropdown" id="userDropdown">
                        <ul>
                            <li><a href="../personal-info.html">个人信息</a></li>
                            <li><a href="#" onclick="logout()">退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- 商品统计详情 -->
            <div id="productStatistics" class="fade-in">
                <div class="dashboard-cards" style="margin-bottom: 30px;">
                    <div class="dashboard-card">
                        <div class="card-icon">📦</div>
                        <div class="card-title">商品总数</div>
                        <div class="card-value">120</div>
                    </div>
                    <div class="dashboard-card">
                        <div class="card-icon">📤</div>
                        <div class="card-title">上架商品</div>
                        <div class="card-value">98</div>
                    </div>
                    <div class="dashboard-card">
                        <div class="card-icon">📥</div>
                        <div class="card-title">下架商品</div>
                        <div class="card-value">22</div>
                    </div>
                    <div class="dashboard-card">
                        <div class="card-icon">⚠️</div>
                        <div class="card-title">库存不足</div>
                        <div class="card-value">8</div>
                    </div>
                </div>
                
                <!-- 搜索框 -->
                <div class="search-box">
                    <input type="text" placeholder="搜索商品...">
                    <button class="btn btn-primary">搜索</button>
                </div>
                
                <!-- 商品列表 -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>商品名称</th>
                                <th>分类</th>
                                <th>价格</th>
                                <th>库存</th>
                                <th>状态</th>
                                <th>兑换次数</th>
                            </tr>
                        </thead>
                        <tbody id="productStatisticsList">
                            <!-- 商品统计数据将通过JS动态生成 -->
                        </tbody>
                    </table>
                </div>
                
                <!-- 分页 -->
                <div class="pagination">
                    <button>上一页</button>
                    <button class="active">1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>下一页</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/app.js"></script>
    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 加载用户信息
            loadUserInfo();
            // 加载商品统计数据
            loadProductStatistics();
        });
        
        /**
         * 加载用户信息
         */
        function loadUserInfo() {
            const user = getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = user.name;
                document.getElementById('userAvatar').textContent = user.name.charAt(0);
            }
        }
        
        /**
         * 切换用户下拉菜单
         */
        function toggleUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown.classList.toggle('show');
        }
        
        /**
         * 点击页面其他地方关闭下拉菜单
         */
        document.addEventListener('click', function(event) {
            const userInfo = document.querySelector('.user-info');
            const dropdown = document.getElementById('userDropdown');
            if (!userInfo.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });
        
        /**
         * 加载商品统计数据 — 基于实际数据
         */
        function loadProductStatistics() {
            const productStatisticsList = document.getElementById('productStatisticsList');
            if (!productStatisticsList) return;

            productStatisticsList.innerHTML = '';

            // 从全局商品数据获取
            const products = getProducts();

            // 更新统计卡片
            const cards = document.querySelectorAll('.dashboard-cards .dashboard-card .card-value');
            if (cards.length >= 4) {
                const listed = products.filter(p => p.status === '上架').length;
                const unlisted = products.filter(p => p.status === '下架').length;
                const lowStock = products.filter(p => p.stock <= 5 && p.status === '上架').length;
                cards[0].textContent = products.length;
                cards[1].textContent = listed;
                cards[2].textContent = unlisted;
                cards[3].textContent = lowStock;
            }

            products.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.name}</td>
                    <td>${item.category}</td>
                    <td>${item.price}</td>
                    <td>${item.stock}</td>
                    <td><span class="status-tag ${item.status === '上架' ? 'status-normal' : 'status-disabled'}">${item.status}</span></td>
                    <td>${item.exchangeCount}</td>
                `;
                productStatisticsList.appendChild(row);
            });
        }
    </script>
</body>
</html>
