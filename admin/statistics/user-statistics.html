<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户统计 - 企业员工积分兑换系统</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>管理员后台</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="../admin.html">仪表盘</a></li>
                <li><a href="../user-management.html">用户管理</a></li>
                <li><a href="../product-management.html">商品管理</a></li>
                <li><a href="../exchange-management.html">兑换管理</a></li>
                <li><a href="../points-management.html">积分管理</a></li>
            </ul>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部导航栏 -->
            <div class="top-nav">
                <div class="nav-left">
                    <h1>用户统计详情</h1>
                </div>
                <div class="nav-right">
                    <div class="user-info" onclick="toggleUserDropdown()">
                        <div class="user-avatar" id="userAvatar"></div>
                        <span id="userName">管理员</span>
                    </div>
                    <div class="user-dropdown" id="userDropdown">
                        <ul>
                            <li><a href="../personal-info.html">个人信息</a></li>
                            <li><a href="#" onclick="logout()">退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- 用户统计详情 -->
            <div id="userStatistics" class="fade-in">
                <div class="dashboard-cards" style="margin-bottom: 30px;">
                    <div class="dashboard-card">
                        <div class="card-icon">👥</div>
                        <div class="card-title">总用户数</div>
                        <div class="card-value">258</div>
                    </div>
                    <div class="dashboard-card">
                        <div class="card-icon">✅</div>
                        <div class="card-title">正常用户</div>
                        <div class="card-value">245</div>
                    </div>
                    <div class="dashboard-card">
                        <div class="card-icon">🚫</div>
                        <div class="card-title">禁用用户</div>
                        <div class="card-value">13</div>
                    </div>
                    <div class="dashboard-card">
                        <div class="card-icon">📅</div>
                        <div class="card-title">今日新增</div>
                        <div class="card-value">3</div>
                    </div>
                </div>
                
                <!-- 搜索框 -->
                <div class="search-box">
                    <input type="text" placeholder="搜索用户...">
                    <button class="btn btn-primary">搜索</button>
                </div>
                
                <!-- 用户列表 -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>工号</th>
                                <th>姓名</th>
                                <th>部门</th>
                                <th>职位</th>
                                <th>积分</th>
                                <th>状态</th>
                                <th>注册时间</th>
                            </tr>
                        </thead>
                        <tbody id="userStatisticsList">
                            <!-- 用户统计数据将通过JS动态生成 -->
                        </tbody>
                    </table>
                </div>
                
                <!-- 分页 -->
                <div class="pagination">
                    <button>上一页</button>
                    <button class="active">1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>下一页</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/app.js"></script>
    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 加载用户信息
            loadUserInfo();
            // 加载用户统计数据
            loadUserStatistics();
        });
        
        /**
         * 加载用户信息
         */
        function loadUserInfo() {
            const user = getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = user.name;
                document.getElementById('userAvatar').textContent = user.name.charAt(0);
            }
        }
        
        /**
         * 切换用户下拉菜单
         */
        function toggleUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown.classList.toggle('show');
        }
        
        /**
         * 点击页面其他地方关闭下拉菜单
         */
        document.addEventListener('click', function(event) {
            const userInfo = document.querySelector('.user-info');
            const dropdown = document.getElementById('userDropdown');
            if (!userInfo.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });
        
        /**
         * 加载用户统计数据 — 基于实际数据
         */
        function loadUserStatistics() {
            const userStatisticsList = document.getElementById('userStatisticsList');
            if (!userStatisticsList) return;

            userStatisticsList.innerHTML = '';

            // 从实际数据源获取
            const users = getUsers();
            const employees = users.filter(u => u.role === 'employee');

            // 更新统计卡片
            const cards = document.querySelectorAll('.dashboard-cards .dashboard-card .card-value');
            if (cards.length >= 4) {
                const normal = employees.filter(u => u.status === 'normal').length;
                const disabled = employees.filter(u => u.status === 'disabled').length;
                cards[0].textContent = employees.length;
                cards[1].textContent = normal;
                cards[2].textContent = disabled;
                // 今日新增保持模拟值（无注册时间数据）
            }

            employees.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>EMP${String(item.id).padStart(3, '0')}</td>
                    <td>${item.name}</td>
                    <td>${item.department || '-'}</td>
                    <td>${item.position || '-'}</td>
                    <td>${item.points || 0}</td>
                    <td><span class="status-tag ${item.status === 'normal' ? 'status-normal' : 'status-disabled'}">${item.status === 'normal' ? '正常' : '禁用'}</span></td>
                    <td>2026-01-${String(item.id + 10).padStart(2, '0')}</td>
                `;
                userStatisticsList.appendChild(row);
            });
        }
    </script>
</body>
</html>
