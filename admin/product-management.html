<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 - 企业员工积分兑换系统</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>管理员后台</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="admin.html">仪表盘</a></li>
                <li><a href="user-management.html">用户管理</a></li>
                <li><a href="product-management.html" class="active">商品管理</a></li>
                <li><a href="exchange-management.html">兑换管理</a></li>
                <li><a href="points-management.html">积分管理</a></li>
            </ul>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部导航栏 -->
            <div class="top-nav">
                <div class="nav-left">
                    <h1>商品管理</h1>
                </div>
                <div class="nav-right">
                    <div class="user-info" onclick="toggleUserDropdown()">
                        <div class="user-avatar" id="userAvatar"></div>
                        <span id="userName">管理员</span>
                    </div>
                    <div class="user-dropdown" id="userDropdown">
                        <ul>
                            <li><a href="personal-info.html">个人信息</a></li>
                            <li><a href="#" onclick="logout()">退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- 商品管理内容 -->
            <div class="dashboard">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索商品...">
                    <button class="btn btn-primary" onclick="searchProducts()">搜索</button>
                    <button class="btn btn-secondary" onclick="addProduct()">添加商品</button>
                </div>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>商品名称</th>
                                <th>分类</th>
                                <th>积分价格</th>
                                <th>库存</th>
                                <th>状态</th>
                                <th>兑换次数</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody">
                            <!-- 商品数据将通过JS动态生成 -->
                        </tbody>
                    </table>
                </div>
                
                <div class="pagination">
                    <button onclick="prevPage()">上一页</button>
                    <button class="active">1</button>
                    <button onclick="nextPage()">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加商品模态框 -->
    <div class="modal" id="addProductModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">添加商品</h3>
                <button class="modal-close" onclick="closeModal('addProductModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>商品名称</label>
                    <input type="text" id="newProductName" placeholder="请输入商品名称">
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <input type="text" id="newProductCategory" placeholder="请输入分类">
                </div>
                <div class="form-group">
                    <label>积分价格</label>
                    <input type="number" id="newProductPrice" placeholder="请输入积分价格">
                </div>
                <div class="form-group">
                    <label>库存</label>
                    <input type="number" id="newProductStock" placeholder="请输入库存">
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select id="newProductStatus">
                        <option value="上架">上架</option>
                        <option value="下架">下架</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-secondary" onclick="closeModal('addProductModal')">取消</button>
                <button class="btn btn-primary" onclick="saveProduct()">保存</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 加载用户信息
            loadUserInfo();
            // 加载商品列表
            loadProductList();
        });
        
        /**
         * 加载用户信息
         */
        function loadUserInfo() {
            const user = getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = user.name;
                document.getElementById('userAvatar').textContent = user.name.charAt(0);
            }
        }
        
        /**
         * 切换用户下拉菜单
         */
        function toggleUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown.classList.toggle('show');
        }
        
        /**
         * 点击页面其他地方关闭下拉菜单
         */
        document.addEventListener('click', function(event) {
            const userInfo = document.querySelector('.user-info');
            const dropdown = document.getElementById('userDropdown');
            if (!userInfo.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });
        
        /**
         * 加载商品列表
         */
        function loadProductList() {
            const productTableBody = document.getElementById('productTableBody');
            if (!productTableBody) return;
            
            const products = getProducts();
            productTableBody.innerHTML = '';
            
            products.forEach(product => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${product.id}</td>
                    <td>${product.name}</td>
                    <td>${product.category}</td>
                    <td>${product.price}</td>
                    <td>${product.stock}</td>
                    <td><span class="status-tag ${product.status === '上架' ? 'status-normal' : 'status-disabled'}">${product.status}</span></td>
                    <td>${product.exchangeCount}</td>
                    <td>
                        <button class="btn btn-primary" onclick="editProduct(${product.id})">编辑</button>
                        <button class="btn btn-secondary" onclick="deleteProduct(${product.id})">删除</button>
                    </td>
                `;
                productTableBody.appendChild(row);
            });
        }
        
        /**
         * 搜索商品
         */
        function searchProducts() {
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            const productTableBody = document.getElementById('productTableBody');
            if (!productTableBody) return;
            
            const products = getProducts();
            productTableBody.innerHTML = '';
            
            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(searchInput) || 
                product.category.toLowerCase().includes(searchInput)
            );
            
            filteredProducts.forEach(product => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${product.id}</td>
                    <td>${product.name}</td>
                    <td>${product.category}</td>
                    <td>${product.price}</td>
                    <td>${product.stock}</td>
                    <td><span class="status-tag ${product.status === '上架' ? 'status-normal' : 'status-disabled'}">${product.status}</span></td>
                    <td>${product.exchangeCount}</td>
                    <td>
                        <button class="btn btn-primary" onclick="editProduct(${product.id})">编辑</button>
                        <button class="btn btn-secondary" onclick="deleteProduct(${product.id})">删除</button>
                    </td>
                `;
                productTableBody.appendChild(row);
            });
        }
        
        /**
         * 添加商品
         */
        function addProduct() {
            const modal = document.getElementById('addProductModal');
            modal.classList.add('show');
        }
        
        /**
         * 关闭模态框
         * @param {string} modalId 模态框ID
         */
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('show');
        }
        
        /**
         * 保存商品 — 真实写入 localStorage
         */
        function saveProduct() {
            const name = document.getElementById('newProductName').value.trim();
            const category = document.getElementById('newProductCategory').value.trim();
            const price = parseInt(document.getElementById('newProductPrice').value) || 0;
            const stock = parseInt(document.getElementById('newProductStock').value) || 0;
            const status = document.getElementById('newProductStatus').value;

            if (!name || !category || price <= 0) {
                alert('请完整填写商品信息（名称、分类、价格）');
                return;
            }

            const data = JSON.parse(localStorage.getItem('exchange_system_data'));
            const maxId = data.products.reduce((max, p) => Math.max(max, p.id), 0);
            data.products.push({
                id: maxId + 1,
                name, category, price, stock, status,
                exchangeCount: 0
            });
            localStorage.setItem('exchange_system_data', JSON.stringify(data));

            alert('商品添加成功！');
            closeModal('addProductModal');
            // 清空表单
            document.getElementById('newProductName').value = '';
            document.getElementById('newProductCategory').value = '';
            document.getElementById('newProductPrice').value = '';
            document.getElementById('newProductStock').value = '';
            loadProductList();
        }

        /**
         * 编辑商品
         * @param {number} productId 商品ID
         */
        function editProduct(productId) {
            const data = JSON.parse(localStorage.getItem('exchange_system_data'));
            const product = data.products.find(p => p.id === productId);
            if (!product) {
                alert('商品不存在');
                return;
            }
            const newName = prompt('商品名称：', product.name);
            if (!newName || newName.trim() === '') return;
            const newCategory = prompt('分类：', product.category);
            if (!newCategory) return;
            const newPrice = parseInt(prompt('积分价格：', product.price)) || product.price;
            const newStock = parseInt(prompt('库存：', product.stock)) || product.stock;
            const newStatus = prompt('状态（上架/下架）：', product.status);

            product.name = newName.trim();
            product.category = newCategory;
            product.price = newPrice;
            product.stock = newStock;
            if (newStatus === '上架' || newStatus === '下架') product.status = newStatus;

            localStorage.setItem('exchange_system_data', JSON.stringify(data));
            loadProductList();
        }

        /**
         * 删除商品 — 真实删除
         * @param {number} productId 商品ID
         */
        function deleteProduct(productId) {
            if (!confirm('确定要删除这个商品吗？')) return;
            const data = JSON.parse(localStorage.getItem('exchange_system_data'));
            const idx = data.products.findIndex(p => p.id === productId);
            if (idx !== -1) {
                data.products.splice(idx, 1);
                localStorage.setItem('exchange_system_data', JSON.stringify(data));
                alert('商品删除成功！');
            }
            loadProductList();
        }
        
        /**
         * 上一页
         */
        function prevPage() {
            alert('上一页功能开发中...');
        }
        
        /**
         * 下一页
         */
        function nextPage() {
            alert('下一页功能开发中...');
        }
    </script>
</body>
</html>
